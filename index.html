<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mamdouh Student Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/" aria-label="Mamdouh Student Monitor, go to dashboard">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#8fb0ff"/>
          <path d="M6 22 L12 15 L17 19 L26 8" fill="none" stroke="#14213d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="26" cy="8" r="2.6" fill="#14213d"/>
        </svg>
        <span class="brand-text">
          <strong>Mamdouh</strong>
          <span>Student Monitor</span>
        </span>
      </a>

      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="dashboard">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/></svg>
          Dashboard
        </a>
        <a href="#/groups" data-nav="groups">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5z"/><circle cx="17" cy="9" r="2.5"/><path d="M16.6 14c2.7.1 4.4 1.9 4.4 4.500h-4.100c0-1.700-.1-3.200-.3-4.500z"/></svg>
          Groups
        </a>
        <a href="#/sections" data-nav="sections">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h5v14H3zM10 5h5v14h-5zM17 8l4-1 2 11-4 1z"/></svg>
          Sections
        </a>
        <a href="#/students" data-nav="students">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6.500 8-6.500s8 2.500 8 6.500z"/></svg>
          Students
        </a>
      </nav>

      <p id="sample-notice" class="sidebar-note" hidden>Showing sample data</p>
    </aside>

    <main id="view" tabindex="-1"></main>
  </div>

  <script src="config.js"></script>
  <script src="sample-data.js"></script>
  <script src="data-source.js"></script>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
